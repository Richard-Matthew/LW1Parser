[FILE_PATHS]
# The main folder of your XCOM 2012 installation
# Currently unused in release version
strXcomFolder = 'C:\Program Files (x86)\Steam\steamapps\common\XCom-Enemy-Unknown'

# The folder where your game saves are located
strSaveFolder = 'C:\Users\matth\Documents\My Games\XCOM - Enemy Within\XComGame\SaveData'

[SETTINGS]
# Saves unit information to an SQLite database
# A csv file of the latest save stored in the DB can be generated via the Export GUI button
bUseDatabase = false

# If false, running the program is equivalent to pressing the Update GUI button
# Which either updates the SQLite database or exports soldiers to a csv file based on bUseDatabase
bUseGUI = true

# If true the intermediary JSON created by xcom2json will be retained as "export.json"
bKeepJSON = false

# If false, clicking the Convert GUI button will open the file selector in a default location
bConvertOpensSaveFolder = true

# Format for spreadsheet output
# Currently accepted values: EXCEL, CSV
strSpreadsheetFormat = "EXCEL"

# Includes columns comparing each unit's stat rolls to average for a unit of their rank and class
bIncludeStatDeltas = true

[CONDITIONAL_FORMATTING]
# If true, Excel files will have conditional formatting based on the other settings in this section
bUseConditionalFormatting = true

bUseClassFormatting = true
bBoldMECClasses = true

# Bio classes
strRookieFill       = "00339A"
strRookieText       = "000000"

# Scout/Sniper Supraclass
strScout-SniperFill = "FBD500"
strScout-SniperText = "000000"

strScoutFill        = "F9622D"
strScoutText        = "000000"

strSniperFill       = "FBD500"
strSniperText       = "000000"

# Infantry/Assault Supraclass
strTacticalFill     = "FA2D2D"
strTacticalText     = "FFFFFF"

strInfantryFill     = "5780F6"
strInfantryText     = "000000"

strAssaultFill      = "FA2D2D"
strAssaultText      = "000000"

# Gunner/Rocketeer Supraclass
strWeaponsFill      = "5E8E1F"
strWeaponsText      = "000000"

strGunnerFill       = "5E8E1F"
strGunnerText       = "000000"

strRocketeerFill    = "BD107E"
strRocketeerText    = "000000"

# Scout/Sniper Supraclass
strSupportFill      = "1FAD9D"
strSupportText      = "000000"

strMedicFill        = "F6F6F6"
strMedicText        = "000000"

strEngineerFill     = "1FAD9D"
strEngineerText     = "000000"

# MEC Classes
strPathfinderFill   = "F9622D"
strPathfinderText   = "000000"

strJaegerFill       = "FBD500"
strJaegerText       = "000000"

strValkyrieFill     = "5780F6"
strValkyrieText     = "000000"

strMarauderFill     = "FA2D2D"
strMarauderText     = "000000"

strGoliathFill      = "5E8E1F"
strGoliathText      = "000000"

strArcherFill       = "BD107E"
strArcherText       = "000000"

strGuardianFill     = "F6F6F6"
strGuardianText     = "000000"

strShogunFill       = "1FAD9D"
strShogunText       = "000000"

# Formatting for Special column: Officer, Psi, MEC
bUseSpecialFormatting = true

strPsiFill          = "A09CD6"
strPsiText          = "000000"

strOfficerFill      = "67E8ED"
strOfficerText      = "000000"

strMECFill          = "69747C"
strMECText          = "000000"

# Color scales for numeric columns
bUseNumericFormatting = true

# Entries must match column names
strNumericColumns = ["Rank", "Spec", "HP", "Aim", "Mob", "Will", "Def", "SOML"]

strMinFill = "F8696B"
strMidFill = "FFEB84"
strMaxFill = "63BE7B"

# If bIncludeStatDeltas is true, the delta columns corresponding to strNumericColumns will also be formatted
bFormatDeltaColumns = true


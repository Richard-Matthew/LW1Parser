; Formatting for Special column: Officer, Psi, MEC
bUseSpecialFormatting = True

strPsiFill = A09CD6
strPsiText = 000000

strOfficerFill = 67E8ED
strOfficerText = 000000

strMECFill = 69747C
strMECText = 000000

; Color scales for numeric columns
bUseNumericFormatting = True

; Entries must be separated by exactly ", "
strNumericColums = Rank, Spec, HP, Aim, Mob, Will, Def, SOML

strMinFill = F8696B
strMidFill = FFEB84
strMaxFill = 63BE7B

; If bIncludeStatDeltas is True, the delta columns corresponding to strNumericColums will also be formatted
bFormatDeltaColumns = True